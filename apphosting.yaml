# Firebase App Hosting — https://firebase.google.com/docs/app-hosting/configure
#
# 1) أنشئ الأسرار (مرة واحدة) مثلاً:
#    firebase apphosting:secrets:set DATABASE_URL --project YOUR_PROJECT_ID
#    firebase apphosting:secrets:set AUTH_SECRET --project YOUR_PROJECT_ID
# 2) بعد أول rollout انسخ الرابط الفعلي إلى NEXTAUTH_URL و NEXT_PUBLIC_APP_URL
#    (أو عيّنها من Console فقط — القيم في Console تتجاوز هذا الملف).
#
# لا تضع كلمات سر حقيقية هنا.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 40
  minInstances: 0
  maxInstances: 20

# Uncomment after secrets exist in Secret Manager and access is granted to the backend:
# env:
#   - variable: DATABASE_URL
#     secret: DATABASE_URL
#     availability: [BUILD, RUNTIME]
#   - variable: AUTH_SECRET
#     secret: AUTH_SECRET
#     availability: [BUILD, RUNTIME]
#   - variable: NEXTAUTH_URL
#     value: https://YOUR-BACKEND--YOUR-PROJECT.us-central1.hosted.app
#     availability: [BUILD, RUNTIME]
#   - variable: NEXT_PUBLIC_APP_URL
#     value: https://YOUR-BACKEND--YOUR-PROJECT.us-central1.hosted.app
#     availability: [BUILD, RUNTIME]
#   - variable: NEXT_DISABLE_PWA
#     value: "0"
#     availability: [BUILD, RUNTIME]
