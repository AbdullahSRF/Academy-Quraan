# قاعدة بيانات محلية تطابق DATABASE_URL في .env.example
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quran_academy
    ports:
      - "5432:5432"
    volumes:
      - academy_pg:/var/lib/postgresql/data

volumes:
  academy_pg:
